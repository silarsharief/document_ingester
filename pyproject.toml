[tool.poetry]
name = "quicksight-ai"
version = "0.1.0"
description = "Neuro-Symbolic Document Intelligence System"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
# Fast PDF tools (M1 Optimized)
pymupdf = "^1.23.0"
pypdfium2 = "^4.0.0" 

# Ingestion & Parsing
docling = "^2.0.0"
pandas = "^2.2.0"

# Computer Vision (The 'Auditor')
ultralytics = "^8.2.0"
opencv-python-headless = "^4.9.0"
pillow = "^10.0.0"

# AI & Reasoning
google-generativeai = "^0.4.0"
langgraph = "^0.0.26"
langchain = "^0.1.10"

# Backend & Database
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
qdrant-client = "^1.8.0"
einops = "^0.8.2"
timm = "^1.0.24"
tenacity = "^8.1.0"
reportlab = "^4.4.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"